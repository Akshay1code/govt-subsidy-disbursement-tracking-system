spring.application.name=gov-subsidy
spring.profiles.active=${APP_PROFILE:dev}
# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gov_subsidy_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
# ===============================
# DIALECT
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ===============================
# SERVER
# ===============================
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=100MB
# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:7f4c9e2a1b8d6f3c5e7a9b2d4f6c8e1a3b5d7f9c2e4a6b8d0f2c4e6a8b1d3}
# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
